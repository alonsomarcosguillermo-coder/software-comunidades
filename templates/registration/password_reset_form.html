{% extends "base.html" %}

{% block titulo %}Recuperar contraseña{% endblock %}

{% block contenido %}
<section class="tarjeta login">
  <h1>¿Olvidaste tu contraseña?</h1>
  <p class="vacio">Escribe tu email y te enviaremos un enlace para elegir otra.</p>
  <form method="post">
    {% csrf_token %}
    <label for="id_email">Email</label>
    <input type="email" name="email" id="id_email" autocomplete="email" required autofocus>
    <button type="submit">Enviar el enlace</button>
  </form>
</section>
{% endblock %}
